<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#551e42" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="一起花" />
    <meta name="description" content="两个人的极简消费审批：花钱前，先和对方说一声。" />
    <title>一起花 · 两个人的消费审批</title>
    <link rel="icon" href="./app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./app-icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" href="/boot.js" as="script" />
    <style>
      #boot-shell{box-sizing:border-box;min-height:100vh;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 28px) 24px;background:#fbf9f6;color:#251e22;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
      #boot-shell strong{font-size:22px}#boot-shell strong span{color:#551e42}#boot-status{text-align:center;margin-top:28vh;font-size:14px;color:#71666f}
      #boot-retry{display:block;margin:24px auto;min-height:48px;padding:12px 24px;border:0;border-radius:18px;background:#551e42;color:#fff;box-shadow:0 4px 0 #291220;font-size:15px}#boot-retry[hidden]{display:none}
    </style>
  </head>
  <body>
    <div id="root"><main id="boot-shell" aria-live="polite"><strong>一起花<span>.</span></strong><p id="boot-status">正在打开…</p><button id="boot-retry" type="button" hidden>重新打开</button></main></div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
