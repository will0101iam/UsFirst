<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#551e42" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="一起花" />
    <meta name="description" content="两个人的极简消费审批：花钱前，先和对方说一声。" />
    <title>一起花 · 两个人的消费审批</title>
    <link rel="icon" href="./app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./app-icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preload" href="/boot.js" as="script" />
    <style>
      html,body{margin:0;background:#551e42;color:#fff2fa}
      #boot-shell{position:fixed;inset:0;z-index:100;box-sizing:border-box;overflow:auto;padding:max(22px,env(safe-area-inset-top)) 22px calc(35px + env(safe-area-inset-bottom));background:#551e42;color:#fff2fa;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}#boot-shell[hidden]{display:none}
      #boot-records{margin-top:54px}
      #boot-shell strong{font-size:22px}#boot-shell strong span{color:#d6f56a}#boot-status{margin:28px 0 16px;font-size:13px;color:#efc9dd;line-height:1.8}
      .boot-card{margin:16px 0;padding:24px;background:#f5aed2;color:#46243a;border-radius:28px;box-shadow:0 5px 0 #a45e85}.boot-card h2{font-size:25px;margin:12px 0;overflow-wrap:anywhere}.boot-card p{margin:8px 0;font-size:13px}.boot-card .boot-money{font-size:38px;font-weight:650}.boot-card small{font-size:12px}
      #boot-retry{display:block;margin:24px auto;min-height:48px;padding:12px 24px;border:0;border-radius:18px;background:#d6f56a;color:#2c3317;box-shadow:0 4px 0 #83953f;font-size:15px}#boot-retry[hidden]{display:none}
    </style>
  </head>
  <body>
    <section id="boot-shell" aria-live="polite"><strong>一起花<span>.</span></strong><p id="boot-status">正在打开…</p><div id="boot-records"></div><button id="boot-retry" type="button" hidden>重新加载</button><noscript><p>请允许浏览器运行 JavaScript 后重新打开。</p></noscript></section>
    <div id="root"></div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
